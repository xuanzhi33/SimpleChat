<!doctype html>
<html class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 装到桌面/主屏幕时用的是 manifest 里的图标（不是 favicon）；iOS 只认 apple-touch-icon。
         base 是 './'，所以这些 href 会被 Vite 改写成相对路径，manifest 里的 src 也一律相对 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 跟着系统深浅色走，跟应用内默认的「跟随系统」一致 -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <!-- iOS ≤ 16.3 靠这两个 meta 才会以独立窗口打开、用固定名字（更新的版本读 manifest） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SimpleChat" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
  </head>
  <body class="h-full">
    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
