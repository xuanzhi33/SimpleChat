<!doctype html>
<html class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 装到桌面/主屏幕时用的是 manifest 里的图标（不是 favicon）；iOS 只认 apple-touch-icon。
         base 用 Vite 默认的 '/'（部署在自定义域名根目录），所以这些都是根绝对路径 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 地址栏 / 已安装应用的标题栏着色：这里先按系统深浅色各给一个（JS 跑之前用得上），
         跑起来后由 src/lib/theme-color.ts 统一改成跟应用内主题一致（深浅都取边栏背景色） -->
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <!-- iOS ≤ 16.3 靠这两个 meta 才会以独立窗口打开、用固定名字（更新的版本读 manifest） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SimpleChat" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
  </head>
  <body class="h-full">
    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
